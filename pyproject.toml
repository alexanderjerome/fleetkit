[project]
name = "fleetkit"
version = "0.1.0"
description = "fleetkit — NixOS fleet framework (Proxmox / XCP-ng infrastructure-as-code)"
authors = [
    {name = "Alexander Jerome", email = "alexander.jerome@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    # Infrastructure provisioning is terranix → tofu.
    # The CLI wraps `tofu` directly; no Python-SDK provisioning deps needed.
    # CLI / TUI (fleet-launcher provides the `fleet` entry point)
    "fleet-launcher",
    # Standalone XOA operator CLI — `fleet xoa` shims to it
    "xoa-cli",
    "click>=8.3.1,<9.0.0",
    "trogon>=0.6.0,<0.7.0",
    "rich>=13.0",
    "questionary>=2.0",
    # Networking / SSH
    "scapy>=2.6.0,<3.0.0",
    "paramiko>=4.0.0,<5.0.0",
    "requests>=2.32.5,<3.0.0",
    "proxmoxer>=2.0",
    "aiohttp>=3.9",
    # Data / Templates
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tomlkit>=0.13.0,<0.15.0",
    "jinja2>=3.1.0,<4.0.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "pydantic>=2.0",
    # Analytics CLI deps (enables local testing)
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "ipykernel>=7.2.0",
    "notebook>=7.0",
    "ipywidgets>=8.0",
    "playwright~=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
fleet-launcher = { path = "nix/pkgs/_launcher", editable = true }
xoa-cli = { path = "nix/pkgs/xoa-cli", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
