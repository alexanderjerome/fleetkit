[project]
name = "xoa-cli"
version = "0.1.0"
description = "Standalone Xen Orchestra operator CLI for fleetkit fleets"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "websocket-client>=1.8",
]

[project.scripts]
xoa-cli = "xoa_cli.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xoa_cli*"]
