# fleet TUI menu definition
# Used by Textual to render the interactive menu tree.
#
# Schema:
#   menus.<key>:
#     label:       Display name in the menu
#     description: One-line description shown beside the label
#     icon:        Textual/Rich icon name (optional)
#     menus:       Nested sub-menus (recursive)
#     commands:    Leaf actions — each has label, description, run (shell command)
#     args:        Prompted arguments (name + prompt text), injected into `run`

menus:

  deploy:
    label: Deploy
    description: Multi-step deployment pipelines
    icon: rocket
    menus:

      nixos:
        label: NixOS (Colmena)
        description: Declarative NixOS configuration deployment
        commands:
          apply-all:
            label: Apply to all hosts
            description: Deploy NixOS config to every host
            run: fleet deploy nixos apply all
          apply-host:
            label: Apply to a host
            description: Deploy NixOS config to a single host
            run: fleet deploy nixos apply host {host}
            args:
              - name: host
                prompt: "Hostname:"
          apply-remote:
            label: Apply (build on target)
            description: Deploy, building on the target host itself
            run: fleet deploy nixos apply remote {host}
            args:
              - name: host
                prompt: "Hostname:"
          apply-tag:
            label: Apply to a tag
            description: Deploy to all hosts carrying a deployment tag
            run: fleet deploy nixos apply tag {tag}
            args:
              - name: tag
                prompt: "Deployment tag:"
          build:
            label: Build only
            description: Build a host's config locally (no deploy)
            run: fleet deploy nixos build host {host}
            args:
              - name: host
                prompt: "Hostname:"

      tf:
        label: Terranix / OpenTofu
        description: Infrastructure lifecycle via terranix-emitted tofu stacks
        commands:
          list:
            label: List stacks
            description: Enumerate all leaf stacks
            run: fleet deploy tf list
          preview:
            label: Stack preview
            description: Preview changes for a stack (or prefix)
            run: fleet deploy tf preview {scope}
            args:
              - name: scope
                prompt: "Stack scope (e.g. platform.core):"
          apply:
            label: Stack apply
            description: Apply a stack (or prefix)
            run: fleet deploy tf apply {scope} --yes
            args:
              - name: scope
                prompt: "Stack scope (e.g. platform.core):"
          destroy:
            label: Stack destroy
            description: Destroy a stack (preflight-protected)
            run: fleet deploy tf destroy {scope} --yes
            args:
              - name: scope
                prompt: "Stack scope:"
            confirm: true
          state-pull:
            label: State pull
            description: Dump a stack's remote state to a local JSON file
            run: fleet deploy tf state-pull {scope} {out}
            args:
              - name: scope
                prompt: "Stack (single leaf):"
              - name: out
                prompt: "Output file:"
          state-push:
            label: State push
            description: Upload a locally edited state file for a stack
            run: fleet deploy tf state-push {scope} {statefile}
            args:
              - name: scope
                prompt: "Stack (single leaf):"
              - name: statefile
                prompt: "State file:"
            confirm: true
          state-export:
            label: State export
            description: Export live tfstate JSON for all (or matched) stacks
            run: fleet deploy tf state-export {scope}
            args:
              - name: scope
                prompt: "Stack scope (or 'all'):"

  inventory:
    label: Inventory
    description: Host inventory and network scanning
    icon: clipboard
    commands:
      generate:
        label: Generate inventory
        description: Build hosts.json from the fleet manifest
        run: fleet inventory generate
      show:
        label: Show inventory
        description: Display current host inventory table
        run: fleet inventory show
      diff:
        label: Diff declared vs live
        description: Show drift between fleet manifest and live PVE state
        run: fleet inventory diff
      scan:
        label: Scan subnet
        description: Scan for used/available IPs on the network
        run: fleet inventory scan

  ansible:
    label: Ansible
    description: Generated inventory + framework playbooks
    icon: gear
    commands:
      inventory:
        label: Generate inventory
        description: Derive the Ansible inventory from the fleet manifest
        run: fleet ansible inventory
      playbooks:
        label: List playbooks
        description: List playbooks resolvable by `fleet ansible run`
        run: fleet ansible playbooks
      run:
        label: Run playbook
        description: Run a framework or consumer playbook against the fleet
        run: fleet ansible run {playbook}
        args:
          - name: playbook
            prompt: "Playbook name (see `fleet ansible playbooks`):"

  mcp:
    label: MCP
    description: AI-agent (MCP) integration
    icon: robot
    commands:
      config:
        label: Generate .mcp.json
        description: Derive MCP server entries from the fleet's declared settings
        run: fleet mcp config

  bootstraps:
    label: Bootstraps
    description: One-time setup and platform utilities
    icon: wrench
    menus:

      pve:
        label: Proxmox VE
        description: PVE host management and templates
        commands:
          install-nix:
            label: Install Nix
            description: Install Determinate Nix on the PVE host
            run: fleet pve install-nix
          build-template:
            label: Build LXC template
            description: Build NixOS LXC template on PVE host
            run: fleet pve build-template
          status:
            label: Container status
            description: Show PVE container overview
            run: fleet pve status

      step-ca:
        label: step-ca PKI
        description: One-time step-ca root/intermediate bootstrap
        commands:
          bootstrap:
            label: Bootstrap step-ca
            description: Initialize the internal ACME CA on the netgate host
            run: fleet bootstraps step-ca

  devtools:
    label: Dev Tools
    description: Secrets and developer utilities
    icon: tools
    menus:

      secrets:
        label: Secrets
        description: SOPS secrets management
        commands:
          init:
            label: Initialize SOPS store
            description: Scaffold age key, .sops.yaml, and encrypted secrets stub
            run: fleet devtools secrets init
          edit:
            label: Edit secrets
            description: Edit secrets in terminal editor
            run: fleet devtools secrets edit
          keys-list:
            label: List keys
            description: List all secret key paths
            run: fleet devtools secrets keys list
          keys-add:
            label: Add key
            description: Add or set a secret key
            run: fleet devtools secrets keys add {key} {value}
            args:
              - name: key
                prompt: "SOPS key path (slash-separated):"
              - name: value
                prompt: "Value:"

      utilities:
        label: Utilities
        description: Miscellaneous build and inspection tools
        commands:
          builder-cache-key:
            label: Builder cache key
            description: Fetch Nix binary cache public key from the builder host
            run: fleet devtools utilities builder-cache-key
          dump-cli:
            label: Dump CLI surface
            description: Print the full command tree with help text
            run: fleet devtools utilities dump-cli
