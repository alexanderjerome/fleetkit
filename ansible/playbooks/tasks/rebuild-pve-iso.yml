---
# One-shot: rebuild the PVE + PBS answer-file installer ISOs on the fleet's
# NixOS builder host and re-export them over NFS. Run after any change to
# the answer-file generator in nix/.
#
#   fleet ansible run tasks/rebuild-pve-iso

- hosts: nix-builder
  gather_facts: false
  become: true
  tasks:
    - import_role:
        name: nixos/nix-builder
        tasks_from: build-iso
    - import_role:
        name: nixos/nix-builder
        tasks_from: restart-nfs
