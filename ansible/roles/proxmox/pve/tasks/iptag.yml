---
# IP-Tag: keep an `<ipv4>` tag on every running guest so the PVE UI shows
# addresses (port of community tools/pve/add-iptag.sh, reduced to the
# declarative core: a timer that reconciles tags every interval).

- name: install iptag reconcile script
  ansible.builtin.copy:
    dest: /usr/local/sbin/pve-iptag
    mode: "0755"
    content: |
      #!/bin/sh
      # Reconcile IP tags: for every running CT/VM, replace any tag that
      # looks like an IPv4 address with the guest's current primary IPv4.
      set -e
      for id in $(pct list | awk 'NR>1 && $2=="running"{print $1}'); do
        ip=$(pct exec "$id" -- ip -4 -o addr show scope global 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -1 || true)
        [ -n "$ip" ] || continue
        cur=$(pct config "$id" | awk -F': ' '$1=="tags"{print $2}')
        new=$(printf %s "$cur" | tr ';' '\n' | grep -vE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | paste -sd';' -)
        new="${new:+$new;}$ip"
        [ "$new" = "$cur" ] || pct set "$id" -tags "$new"
      done
      for id in $(qm list | awk 'NR>1 && $3=="running"{print $1}'); do
        ip=$(qm guest cmd "$id" network-get-interfaces 2>/dev/null | jq -r '[.[]|select(.name!="lo")|."ip-addresses"[]?|select(."ip-address-type"=="ipv4")|."ip-address"][0] // empty' || true)
        [ -n "$ip" ] || continue
        cur=$(qm config "$id" | awk -F': ' '$1=="tags"{print $2}')
        new=$(printf %s "$cur" | tr ';' '\n' | grep -vE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | paste -sd';' -)
        new="${new:+$new;}$ip"
        [ "$new" = "$cur" ] || qm set "$id" -tags "$new"
      done

- name: install iptag service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-iptag.service
    mode: "0644"
    content: |
      [Unit]
      Description=reconcile IP tags on PVE guests

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/pve-iptag
  register: pve_iptag_service

- name: install iptag timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-iptag.timer
    mode: "0644"
    content: |
      [Unit]
      Description=reconcile IP tags every 5 minutes

      [Timer]
      OnBootSec=2m
      OnUnitActiveSec=5m

      [Install]
      WantedBy=timers.target
  register: pve_iptag_timer

- name: enable iptag timer
  ansible.builtin.systemd:
    name: pve-iptag.timer
    enabled: true
    state: started
    daemon_reload: "{{ pve_iptag_service.changed or pve_iptag_timer.changed }}"
