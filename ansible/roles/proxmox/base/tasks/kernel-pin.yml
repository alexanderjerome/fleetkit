---
# Pin (or unpin) the boot kernel with proxmox-boot-tool (port of community
# tools/pve/kernel-pin.sh). fleet_pve_host_tweaks.kernelPin = "<version>"
# pins; null/absent unpins if a pin is present.

- name: read current kernel pin
  ansible.builtin.command: proxmox-boot-tool kernel list
  register: proxmox_kernel_list
  changed_when: false
  failed_when: false

- name: pin kernel
  ansible.builtin.command: "proxmox-boot-tool kernel pin {{ fleet_pve_host_tweaks.kernelPin }}"
  when:
    - (fleet_pve_host_tweaks.kernelPin | default(none)) is not none
    - ("Pinned kernel:\n" ~ fleet_pve_host_tweaks.kernelPin) not in proxmox_kernel_list.stdout
  changed_when: true

- name: unpin kernel
  ansible.builtin.command: proxmox-boot-tool kernel unpin
  when:
    - (fleet_pve_host_tweaks.kernelPin | default(none)) is none
    - "'Pinned kernel:' in proxmox_kernel_list.stdout"
  changed_when: true
