[defaults]
# No static inventory ships with fleetkit — the `fleet ansible inventory`
# CLI verb generates one from the fleet manifest (hosts.json) at
# .cache/fleet/ansible-inventory.yml, and the launcher exports
# ANSIBLE_INVENTORY pointing at it (env overrides this file).
roles_path              = roles
collections_path        = collections
host_key_checking       = False
retry_files_enabled     = False
forks                   = 10
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = .ansible-facts
fact_caching_timeout    = 3600
stdout_callback         = default
result_format           = yaml
callbacks_enabled       = ansible.posix.profile_tasks
interpreter_python      = auto_silent

[ssh_connection]
pipelining              = True
control_path            = %(directory)s/%%h-%%p-%%r
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

[privilege_escalation]
become                  = True
become_method           = sudo
become_user             = root
become_ask_pass         = False
